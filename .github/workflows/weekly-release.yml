name: Package weekly market release

on:
  push:
    branches: [main]
    paths: [release-manifest.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Weekly market prices v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate and archive the public package
        env:
          EVENT: ${{ github.event_name }}
        run: |
          manifest=release-manifest.json
          version=$(jq -er '.version | select(test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' "$manifest")
          sha=$(jq -er '.sha256 | select(test("^[0-9a-f]{64}$"))' "$manifest")
          printf '%s  Melindaa.filter\n' "$sha" | sha256sum --check
          if [ "$EVENT" = push ]; then
            date=$(jq -er '.marketRefresh.date | select(test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' "$manifest")
            grep -Fq "### v$version — Market prices" CHANGELOG.md
            grep -Fq "**$date**" CHANGELOG.md
            printf 'MARKET_DATE=%s\n' "$date" >> "$GITHUB_ENV"
          fi
          sudo add-apt-repository -y multiverse
          sudo apt-get update -qq
          sudo apt-get install -y rar
          files=(Melindaa.filter README.md CHANGELOG.md FILTER-SPECIFICATION.md MIT-NOTICE.txt release-manifest.json filters.json filter_definitions.json)
          zip -q -9 Melindaa.zip "${files[@]}"
          rar a -idq -ep -m5 Melindaa.rar "${files[@]}"
          unzip -tq Melindaa.zip
          rar t -idq Melindaa.rar
          printf 'VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Publish the price-only release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" Melindaa.zip Melindaa.rar --clobber --repo "$GITHUB_REPOSITORY"
          else
            printf 'HR/WSS estimates updated using market data collected on %s (Vilnius time).\n\nHR/WSS įverčiai atnaujinti pagal %s surinktus rinkos duomenis.\n' "$MARKET_DATE" "$MARKET_DATE" > "$RUNNER_TEMP/release-notes.md"
            gh release create "$tag" Melindaa.zip Melindaa.rar --target "$GITHUB_SHA" --title "Melindaa $tag — Market prices" --notes-file "$RUNNER_TEMP/release-notes.md" --repo "$GITHUB_REPOSITORY"
          fi
